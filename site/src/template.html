<title>ReviewHelper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="RL 与大模型 Infra 面试复习：理论、verl、DSpark、带测试用例的代码题与速问速答。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: 实验手册式三栏 —— 左侧目录 / 中间正文 / 右侧本页提纲；首页用一条 RL step 的 profiler trace 作为主视觉。
   Color: 冷灰纸面 + 群青交互色；两个“岗位色”编码内容归属：RL=琥珀，Infra=青绿。 */
:root {
  --bg: #F1F3F6;
  --side: #E8EBF0;
  --panel: #FFFFFF;
  --sunk: #E6EAF0;
  --line: #D3D9E2;
  --line-soft: #E1E6EC;
  --ink: #101722;
  --ink-2: #364152;
  --muted: #677285;
  --accent: #2443C4;
  --accent-ink: #FFFFFF;
  --accent-tint: #E3E8FB;
  --rl: #B85C0B;
  --rl-tint: #FBEADB;
  --infra: #0A7570;
  --infra-tint: #D9F0EE;
  --gen: #5A6476;
  --gen-tint: #E4E7EE;
  --ok: #1D8048;
  --ok-tint: #DDF2E5;
  --bad: #C0362C;
  --bad-tint: #FBE3E0;
  --warn: #A86A10;
  --warn-tint: #FAEFD9;
  --code-bg: #121924;
  --code-line: #222C3A;
  --code-fg: #DCE3EC;
  --code-muted: #7D8AA0;
  --hl-kw: #F4A462;
  --hl-str: #93D6A6;
  --hl-num: #F7CD78;
  --hl-fn: #8AB8FF;
  --hl-built: #6FD6CE;
  --hl-meta: #C9A2FF;
  --shadow: 0 1px 2px rgba(16, 23, 34, .06), 0 8px 24px rgba(16, 23, 34, .06);

  --font-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans SC", monospace;

  --fs-xs: .75rem;
  --fs-sm: .8125rem;
  --fs-base: .96875rem;
  --fs-md: 1.0625rem;
  --fs-lg: 1.3rem;
  --fs-xl: 1.7rem;
  --fs-2xl: clamp(1.9rem, 1.4rem + 1.8vw, 2.6rem);
  --fs-hero: clamp(2.6rem, 1.6rem + 4.2vw, 4.4rem);
  --radius: 10px;
  --side-w: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218; --side: #121821; --panel: #161D27; --sunk: #1B2430; --line: #2A3444; --line-soft: #222B38;
    --ink: #E7EBF1; --ink-2: #C3CBD7; --muted: #8C97A8;
    --accent: #8EA2FF; --accent-ink: #0E1218; --accent-tint: #1D2547;
    --rl: #F0A257; --rl-tint: #36230F; --infra: #4CC8BF; --infra-tint: #0E2D2B; --gen: #A3ADBE; --gen-tint: #232B37;
    --ok: #5BD08A; --ok-tint: #12301F; --bad: #FF7B6E; --bad-tint: #3A1A17; --warn: #F2BE5C; --warn-tint: #352812;
    --code-bg: #0A0E14; --code-line: #1C2533; --code-fg: #DCE3EC; --code-muted: #75839A;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218; --side: #121821; --panel: #161D27; --sunk: #1B2430; --line: #2A3444; --line-soft: #222B38;
  --ink: #E7EBF1; --ink-2: #C3CBD7; --muted: #8C97A8;
  --accent: #8EA2FF; --accent-ink: #0E1218; --accent-tint: #1D2547;
  --rl: #F0A257; --rl-tint: #36230F; --infra: #4CC8BF; --infra-tint: #0E2D2B; --gen: #A3ADBE; --gen-tint: #232B37;
  --ok: #5BD08A; --ok-tint: #12301F; --bad: #FF7B6E; --bad-tint: #3A1A17; --warn: #F2BE5C; --warn-tint: #352812;
  --code-bg: #0A0E14; --code-line: #1C2533; --code-fg: #DCE3EC; --code-muted: #75839A;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--fs-base);
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; letter-spacing: -.01em; }
code, pre, kbd, .mono { font-family: var(--font-mono); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.sidebar {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  overflow-y: auto; overscroll-behavior: contain;
  background: var(--side); border-right: 1px solid var(--line);
  padding-block: 22px 40px;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: 14px;
  display: flex; flex-direction: column; gap: 18px;
  scrollbar-width: thin;
}
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); padding: 0 6px; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; letter-spacing: -.02em; line-height: 1.1; }
.brand-sub { display: block; font-family: var(--font-mono); font-size: .68rem; color: var(--muted); letter-spacing: .04em; font-weight: 500; }
.search-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
  color: var(--muted); font-size: var(--fs-sm); cursor: pointer; text-align: left;
}
.search-btn:hover { border-color: var(--accent); color: var(--ink-2); }
.search-btn kbd { margin-left: auto; font-size: .7rem; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--sunk); }
.nav { display: flex; flex-direction: column; gap: 14px; }
.nav-home { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; color: var(--ink-2); font-weight: 500; font-size: var(--fs-sm); }
.nav-home:hover { background: var(--sunk); text-decoration: none; }
.nav-home.active { background: var(--panel); color: var(--ink); box-shadow: var(--shadow); }
.nav-group { display: flex; flex-direction: column; gap: 2px; }
.nav-group-label { font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); padding: 0 8px 4px; }
.nav-sec-head {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 8px; border: 0; background: none; cursor: pointer;
  border-radius: 7px; font-size: var(--fs-sm); font-weight: 600; color: var(--ink); text-align: left;
}
.nav-sec-head:hover { background: var(--sunk); }
.nav-sec-head .caret { margin-left: auto; color: var(--muted); transition: transform .15s; font-size: .7rem; }
.nav-sec-head[aria-expanded="false"] .caret { transform: rotate(-90deg); }
.nav-sec-head .count { font-family: var(--font-mono); font-size: .68rem; color: var(--muted); font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.dot.t-rl { background: var(--rl); } .dot.t-infra { background: var(--infra); } .dot.t-gen { background: var(--gen); }
.nav-items { list-style: none; margin: 2px 0 6px; padding: 0 0 0 12px; border-left: 1px solid var(--line); margin-left: 11px; }
.nav-items[hidden] { display: none; }
.nav-items a {
  display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px;
  color: var(--ink-2); font-size: var(--fs-sm); line-height: 1.45;
}
.nav-items a:hover { background: var(--sunk); text-decoration: none; color: var(--ink); }
.nav-items a.active { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.tick { width: 12px; flex: none; font-size: .7rem; color: transparent; transform: translateY(-1px); }
.is-done .tick { color: var(--ok); }
.side-foot { margin-top: auto; font-size: var(--fs-xs); color: var(--muted); padding: 0 8px; line-height: 1.6; }
.side-foot code { font-size: .7rem; }

.topbar { display: none; }
.main { min-width: 0; }
.main-inner {
  padding-block: 40px 96px;
  padding-left: max(40px, env(safe-area-inset-left, 0px));
  padding-right: max(40px, env(safe-area-inset-right, 0px));
}
.scrim { display: none; }

/* ---------- doc page ---------- */
.page-doc { display: grid; grid-template-columns: minmax(0, 760px) 220px; gap: 56px; justify-content: center; }
.doc-main { min-width: 0; }
.doc-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
.eyebrow { font-family: var(--font-mono); font-size: var(--fs-xs); letter-spacing: .08em; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.eyebrow a { color: var(--muted); }
.eyebrow a:hover { color: var(--accent); }
.doc-head h1 { font-size: var(--fs-2xl); line-height: 1.15; margin: 0; font-weight: 800; }
.lede { margin: 0; color: var(--ink-2); font-size: var(--fs-md); max-width: 62ch; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; font-size: .72rem; line-height: 1; padding: 5px 8px; border-radius: 5px;
  background: var(--gen-tint); color: var(--gen); font-weight: 500; white-space: nowrap;
}
.chip.t-rl { background: var(--rl-tint); color: var(--rl); }
.chip.t-infra { background: var(--infra-tint); color: var(--infra); }
.chip.d-easy { background: var(--ok-tint); color: var(--ok); }
.chip.d-mid { background: var(--warn-tint); color: var(--warn); }
.chip.d-hard { background: var(--bad-tint); color: var(--bad); }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 40px); align-self: start; max-height: calc(100vh - 80px); overflow: auto; font-size: var(--fs-sm); }
.toc-label { font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; }
.toc a { display: block; color: var(--muted); padding: 3px 0 3px 12px; border-left: 2px solid var(--line-soft); line-height: 1.5; }
.toc a.l3 { padding-left: 24px; font-size: .78rem; }
.toc a:hover { color: var(--ink); text-decoration: none; }
.toc a.active { color: var(--accent); border-left-color: var(--accent); }

/* ---------- prose ---------- */
.prose { font-size: var(--fs-base); color: var(--ink); }
.prose > * + * { margin-top: 1em; }
.prose p, .prose ul, .prose ol { margin-bottom: 0; }
.prose h2 { font-size: var(--fs-xl); margin: 2.2em 0 .2em; line-height: 1.25; font-weight: 800; }
.prose h3 { font-size: var(--fs-lg); margin: 1.8em 0 .1em; line-height: 1.3; font-weight: 600; }
.prose h4 { font-size: var(--fs-md); margin: 1.5em 0 0; font-family: var(--font-body); font-weight: 700; }
.prose h2:first-child, .prose h3:first-child { margin-top: 0; }
.prose ul, .prose ol { padding-left: 1.4em; }
.prose li + li { margin-top: .3em; }
.prose li > ul, .prose li > ol { margin-top: .3em; }
.prose li::marker { color: var(--muted); }
.prose strong { font-weight: 650; color: var(--ink); }
.prose :not(pre) > code {
  font-size: .86em; background: var(--sunk); border: 1px solid var(--line-soft); padding: .08em .38em; border-radius: 5px; color: var(--ink);
  overflow-wrap: anywhere;
}
.prose hr { border: 0; height: 1px; background: var(--line); margin: 2.2em 0; }
.prose blockquote { margin-left: 0; padding: .2em 1em; border-left: 3px solid var(--line); color: var(--ink-2); }
.prose img { max-width: 100%; }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.prose table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); line-height: 1.55; }
.prose th, .prose td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
.prose th { background: var(--sunk); font-weight: 600; white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose td code { white-space: nowrap; }
.mb { overflow-x: auto; overflow-y: hidden; padding: .3em 0; }
.mi mjx-container, .mb mjx-container { color: var(--ink); }
mjx-container[display="true"] { margin: .4em 0 !important; }
.prose details { border: 1px solid var(--line); border-radius: var(--radius); padding: .6em 1em; background: var(--panel); }
.prose summary { cursor: pointer; font-weight: 600; }
.prose details[open] summary { margin-bottom: .5em; }

/* callouts */
.callout { border-radius: var(--radius); padding: 14px 16px; background: var(--gen-tint); border: 1px solid var(--line-soft); }
.callout > * + * { margin-top: .6em; }
.callout p, .callout ul, .callout ol { margin: 0; }
.callout > p:not(:first-of-type) { margin-top: .6em; }
.callout-label {
  font-family: var(--font-mono); font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; font-weight: 600;
  display: inline-flex; gap: 6px; align-items: center; color: var(--gen);
}
.callout-tip { background: var(--infra-tint); } .callout-tip .callout-label { color: var(--infra); }
.callout-warn { background: var(--warn-tint); } .callout-warn .callout-label { color: var(--warn); }
.callout-q { background: var(--accent-tint); } .callout-q .callout-label { color: var(--accent); }
.callout-key { background: var(--rl-tint); } .callout-key .callout-label { color: var(--rl); }
.callout-src { background: var(--panel); border-style: dashed; } .callout-src .callout-label { color: var(--muted); }

/* code blocks */
.code { border-radius: var(--radius); background: var(--code-bg); border: 1px solid var(--code-line); overflow: hidden; }
.code-bar { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--code-line); font-family: var(--font-mono); font-size: .7rem; color: var(--code-muted); letter-spacing: .04em; }
.code-bar .fname { color: var(--code-fg); }
.code-bar .spacer { flex: 1; }
.code-bar button { background: transparent; border: 1px solid var(--code-line); color: var(--code-muted); border-radius: 5px; padding: 2px 8px; cursor: pointer; font-size: .7rem; font-family: var(--font-mono); }
.code-bar button:hover { color: var(--code-fg); border-color: var(--code-muted); }
.code pre { margin: 0; padding: 14px 16px; overflow-x: auto; font-size: .8125rem; line-height: 1.65; color: var(--code-fg); tab-size: 4; }
.code pre code { font-family: var(--font-mono); background: none; border: 0; padding: 0; color: inherit; }
.hljs-keyword, .hljs-selector-tag, .hljs-literal { color: var(--hl-kw); }
.hljs-string, .hljs-doctag, .hljs-regexp { color: var(--hl-str); }
.hljs-number { color: var(--hl-num); }
.hljs-title, .hljs-title.function_, .hljs-section { color: var(--hl-fn); }
.hljs-title.class_ { color: var(--hl-built); }
.hljs-built_in, .hljs-type, .hljs-attr, .hljs-variable.language_ { color: var(--hl-built); }
.hljs-comment, .hljs-quote { color: var(--code-muted); font-style: italic; }
.hljs-meta, .hljs-symbol, .hljs-decorator, .hljs-subst { color: var(--hl-meta); }
.hljs-params { color: var(--code-fg); }
.hljs-attribute, .hljs-name { color: var(--hl-fn); }

/* inline diagrams authored in markdown */
.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; font-size: var(--fs-sm); }
.flow > span, .flow > div {
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 6px 10px; line-height: 1.4;
  display: flex; flex-direction: column; justify-content: center;
}
.flow > span small, .flow > div small { color: var(--muted); font-size: .72rem; }
.flow > i { align-self: center; color: var(--muted); font-style: normal; font-family: var(--font-mono); }
.flow .f-rl { background: var(--rl-tint); border-color: transparent; }
.flow .f-infra { background: var(--infra-tint); border-color: transparent; }
.flow .f-accent { background: var(--accent-tint); border-color: transparent; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.cols > div { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; min-width: 0; }
.cols > div > * + * { margin-top: .5em; }
.cols h4 { margin: 0 !important; font-size: var(--fs-sm); }
.diagram { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.diagram svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.diagram .d-box { fill: var(--panel); stroke: var(--line); }
.diagram .d-fill { fill: var(--sunk); stroke: var(--line); }
.diagram .d-rl { fill: var(--rl-tint); stroke: var(--rl); }
.diagram .d-infra { fill: var(--infra-tint); stroke: var(--infra); }
.diagram .d-accent { fill: var(--accent-tint); stroke: var(--accent); }
.diagram .d-text { fill: var(--ink); font-family: var(--font-body); font-size: 12px; }
.diagram .d-muted { fill: var(--muted); font-family: var(--font-mono); font-size: 10.5px; }
.diagram .d-line { stroke: var(--muted); fill: none; stroke-width: 1.3; }
.diagram .d-arrow { fill: var(--muted); }

/* doc footer */
.doc-foot { margin-top: 56px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; }
.doc-foot .pn { align-self: stretch; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: var(--fs-sm); font-weight: 500; line-height: 1.2;
}
.btn:hover { border-color: var(--accent); text-decoration: none; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-done.on { background: var(--ok-tint); color: var(--ok); border-color: transparent; }
.btn-sm { padding: 5px 10px; font-size: var(--fs-xs); }
.contrib { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: var(--fs-sm); color: var(--muted); }
.contrib a { color: var(--muted); text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.contrib a:hover { color: var(--accent); text-decoration-color: currentColor; }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pn a { display: flex; flex-direction: column; gap: 2px; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; color: var(--ink); background: var(--panel); min-width: 0; }
.pn a:hover { border-color: var(--accent); text-decoration: none; }
.pn a.next { text-align: right; grid-column: 2; }
.pn small { color: var(--muted); font-family: var(--font-mono); font-size: .7rem; letter-spacing: .06em; }
.pn span { font-weight: 600; font-size: var(--fs-sm); }

/* ---------- section overview ---------- */
.sec-page { max-width: 880px; margin: 0 auto; }
.item-list { list-style: none; padding: 0; margin: 28px 0 0; display: flex; flex-direction: column; gap: 10px; }
.item-list a {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 12px; align-items: start;
  padding: 14px 16px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink);
}
.item-list a:hover { border-color: var(--accent); text-decoration: none; }
.item-list .n { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--muted); padding-top: 3px; }
.item-list .t { font-weight: 600; line-height: 1.4; }
.item-list .s { color: var(--muted); font-size: var(--fs-sm); line-height: 1.55; margin-top: 3px; }
.item-list .r { display: flex; gap: 6px; align-items: center; padding-top: 2px; }

function flash(pool, onClose) {

  document.body.appendChild(ov);
  function close() { ov.remove(); document.removeEventListener("keydown", onKey); refreshNav(); if (onClose) onClose(); }
  function show() {

    $("h2", ov).innerHTML = md(c.card.q).replace(/^<p>|<\/p>\s*$/g, "");

    typeset($(".flash", ov));

    $(".flash-actions", ov).innerHTML = '<button type="button" class="btn btn-done on" data-f="ok">✓ 会了</button><button type="button" class="btn" data-f="again">再看看</button>';
  }
  function next() { idx = (idx + 1) % order.length; show(); }
  function mark(v) { qaMarks[order[idx].key] = v; store.set("qa", qaMarks); next(); }
  ov.addEventListener("click", function (e) {
    if (e.target === ov || e.target.closest("[data-x]")) return close();
    var b = e.target.closest("[data-f]"); if (!b) return;

  ["verl 官方文档", "https://verl.readthedocs.io/en/latest/", "配置项、算法、Agent Loop、异步训练的权威说明。"],
  ["DSpark 论文", "https://arxiv.org/abs/2607.05147", "Confidence-Scheduled Speculative Decoding with Semi-Autoregressive Generation。"]
];
function renderHome() {

  var el = h('<div class="home"></div>');
  var trace = '<div class="trace" aria-label="verl 一个 PPO step 的阶段耗时示意"><div class="trace-head"><span>timing_raw · 1 PPO step（示意比例）</span><span>verl V1 · _step_once</span></div><div class="trace-rows">' +
    TRACE.map(function (r, i) { return '<span class="k">' + r[0] + '</span><span class="lane"><span class="bar ' + r[3] + '" style="left:' + r[1] + "%;width:" + r[2] + "%;animation-delay:" + (i * 70) + 'ms"></span></span>'; }).join("") +
    '</div><div class="trace-axis"><div></div><div><span>0</span><span>25%</span><span>50%</span><span>75%</span><span>100%</span></div></div>' +
    '<div class="trace-legend"><span><i style="background:var(--infra)"></i>rollout 生成</span><span><i style="background:var(--gen)"></i>前向打分</span><span><i style="background:var(--accent)"></i>优势计算</span><span><i style="background:var(--rl)"></i>反向更新</span><span><i style="background:color-mix(in srgb, var(--infra) 55%, var(--panel))"></i>权重同步</span></div></div>';
  el.innerHTML =
    '<section class="hero"><div class="hero-copy"><div class="eyebrow">INTERVIEW · REVIEW · ' + esc(DATA.generated) + '</div><h1>RL <span class="x">×</span><br>Infra</h1>' +
    "<p>把强化学习和大模型系统的面试知识压成一张地图：先读理论，再用 verl 和 DSpark 两个框架把知识点串起来，最后手写带测试的代码。</p>" +
    '<div class="hero-tags"><span class="chip t-rl">' + nDoc + ' 篇讲义</span><span class="chip t-infra">' + nEx + ' 道可运行的题</span><span class="chip">' + totalCards + " 张问答卡</span></div></div>" + trace + "</section>" +
    '<section><h2 class="h-label">复习地图</h2><div class="sec-grid"></div></section>' +
    '<section class="home-row"><div class="panel" id="quiz"></div><div class="panel"><h2 class="h-label" style="margin:0">本地跑题</h2><div class="cmd-list"></div><div class="resume"></div></div></section>' +
    '<section><h2 class="h-label">配合使用的外部资源</h2><ul class="item-list ext-list">' + EXTERNAL.map(function (x) {
      return '<li><a href="' + x[1] + '" target="_blank" rel="noopener"><span class="n">↗</span><span><div class="t">' + esc(x[0]) + '</div><div class="s">' + esc(x[2]) + "</div></span></a></li>";
    }).join("") + "</ul></section>";
  $(".sec-grid", el).innerHTML = DATA.sections.map(function (s) {
    var p = secProgress(s), unit = s.kind === "qa" ? "卡" : s.kind === "exercise" ? "题" : "篇";
    return '<a class="sec-card" href="#sec-' + s.id + '"><div class="top"><span class="dot t-' + s.track + '"></span>' + esc(s.group) + " · " + TRACK_LABEL[s.track] + "</div><h3>" + esc(s.title) + "</h3><p>" + esc(s.blurb) + '</p><div class="meter"><div class="progress"><i style="width:' + (p.t ? 100 * p.n / p.t : 0) + '%"></i></div>' + p.n + "/" + p.t + " " + unit + "</div></a>";
  }).join("");
  var cmds = $(".cmd-list", el);
  [["装依赖（一次）", "uv sync"], ["跑全部题（测你的 template.py）", "uv run run.py"], ["只跑某题并看详细报错", "uv run run.py gae -v"], ["用参考答案自检", "uv run run.py --solution"]].forEach(function (c) {
    cmds.appendChild(h("<p>" + esc(c[0]) + "</p>"));
    cmds.appendChild(codeBlock(c[1], "bash"));
  });
  var last = BY_ID[store.get("last", "")];
  if (last) $(".resume", el).innerHTML = '<span class="h-label" style="margin:0">继续</span><a href="#' + last.id + '">' + esc(last.title) + "</a>";
  else $(".resume", el).remove();
  view.appendChild(el);

}
function renderQuiz(box) {
  if (!ALL_CARDS.length) { box.innerHTML = '<h2 class="h-label">随机抽一题</h2><p class="quiz-from">还没有问答卡。</p>'; return; }
  var pool = ALL_CARDS.filter(function (c) { return qaMarks[c.key] !== "ok"; });
  if (!pool.length) pool = ALL_CARDS;
  var c = pool[Math.floor(Math.random() * pool.length)];
  box.innerHTML = '<h2 class="h-label" style="margin:0">随机抽一题</h2><div class="quiz-from"></div><p class="quiz-q"></p><div class="quiz-a prose" hidden></div><div class="runner-actions"><button type="button" class="btn btn-primary" data-q="show">显示答案</button><button type="button" class="btn" data-q="next">换一题</button><button type="button" class="btn" data-q="flash">连续抽卡</button></div>';
  $(".quiz-from", box).textContent = c.deck.title + " · Q" + String(c.i + 1).padStart(2, "0");
  $(".quiz-q", box).innerHTML = md(c.card.q).replace(/^<p>|<\/p>\s*$/g, "");
  typeset(box);
  box.onclick = function (e) {
    var b = e.target.closest("[data-q]"); if (!b) return;
    var a = b.getAttribute("data-q");
    if (a === "show") { var qa = $(".quiz-a", box); qa.innerHTML = md(c.card.a); qa.hidden = false; enhance(qa); b.remove(); }
    if (a === "next") renderQuiz(box);
    if (a === "flash") flash(ALL_CARDS, function () { renderQuiz(box); });
  };
}

/* ---------- search ---------- */
var searchIndex = null;
function plain(s) { return String(s || "").replace(/```[a-z]*\n?/g, " ").replace(/<[^>]+>/g, " ").replace(/[#>*_`|\\]/g, " ").replace(/\s+/g, " ").trim(); }
function buildIndex() {
  searchIndex = [];
  ITEMS.forEach(function (it) {
    var sec = it.section;
    if (sec.kind === "qa") {
      it.cards.forEach(function (c, j) { searchIndex.push({ id: it.id, card: j, title: plain(c.q), from: "速问速答 · " + it.title, text: plain(c.a) }); });
    } else {
      searchIndex.push({ id: it.id, title: it.title, from: sec.group + " · " + sec.title, text: plain((it.summary || "") + " " + (it.tags || []).join(" ") + " " + it.md + " " + (it.explain || "")) });
    }
  });
}
function hl(s, q) {
  var i = s.toLowerCase().indexOf(q);
  return i < 0 ? esc(s) : esc(s.slice(0, i)) + "<mark>" + esc(s.slice(i, i + q.length)) + "</mark>" + esc(s.slice(i + q.length));
}
function openPalette() {
  if ($(".palette-overlay")) return;
  if (!searchIndex) buildIndex();
  var ov = h('<div class="palette-overlay" role="dialog" aria-modal="true" aria-label="搜索"><div class="palette"><input id="rh-search" type="search" placeholder="搜 PPO、KV cache、ZeRO、置信度…" autocomplete="off"><div class="palette-results"></div></div></div>');
  document.body.appendChild(ov);
  var input = $("input", ov), res = $(".palette-results", ov), sel = 0, hits = [];
  function close() { ov.remove(); }
  function go(hit) { close(); if (hit.card != null) pendingCard = hit.card; if (location.hash === "#" + hit.id) route(); else location.hash = hit.id; }
  function run() {
    var q = input.value.trim().toLowerCase();
    if (!q) { res.innerHTML = '<div class="palette-empty">输入关键词，回车跳转。也可以按 <kbd>/</kbd> 随时打开。</div>'; hits = []; return; }
    hits = [];
    searchIndex.forEach(function (e) {
      var t = e.title.toLowerCase().indexOf(q), x = e.text.toLowerCase().indexOf(q);
      if (t < 0 && x < 0) return;
      var score = (t >= 0 ? 10 - Math.min(t, 9) : 0) + (x >= 0 ? 1 : 0);
      var snip = "";
      if (x >= 0) { var a = Math.max(0, x - 30); snip = (a > 0 ? "…" : "") + e.text.slice(a, x + q.length + 60) + "…"; }
      hits.push({ e: e, score: score, snip: snip });
    });
    hits.sort(function (a, b) { return b.score - a.score; });
    hits = hits.slice(0, 40); sel = 0;
    res.innerHTML = hits.length ? hits.map(function (r, i) {
      return '<a href="#' + r.e.id + '" data-i="' + i + '" class="' + (i === 0 ? "sel" : "") + '"><span class="pf">' + esc(r.e.from) + '</span><span class="pt">' + hl(r.e.title, q) + "</span>" + (r.snip ? '<span class="ps">' + hl(r.snip, q) + "</span>" : "") + "</a>";
    }).join("") : '<div class="palette-empty">没有找到“' + esc(input.value) + "”。换个说法，或者搜英文缩写。</div>";
  }
  function paintSel() { $$("a", res).forEach(function (a, i) { a.classList.toggle("sel", i === sel); if (i === sel) a.scrollIntoView({ block: "nearest" }); }); }
  input.addEventListener("input", run);
  input.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { e.preventDefault(); sel = Math.min(sel + 1, hits.length - 1); paintSel(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); sel = Math.max(sel - 1, 0); paintSel(); }
    else if (e.key === "Enter" && hits[sel]) { e.preventDefault(); go(hits[sel].e); }
    else if (e.key === "Escape") close();
  });
  res.addEventListener("click", function (e) { var a = e.target.closest("a[data-i]"); if (!a) return; e.preventDefault(); go(hits[+a.getAttribute("data-i")].e); });
  ov.addEventListener("click", function (e) { if (e.target === ov) close(); });
  run();
  input.focus();
}
document.getElementById("searchBtn").addEventListener("click", openPalette);
document.getElementById("searchBtn2").addEventListener("click", openPalette);
document.addEventListener("keydown", function (e) {
  var typing = /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || "");
  if ((e.key === "k" && (e.metaKey || e.ctrlKey)) || (e.key === "/" && !typing && !$(".flash-overlay"))) { e.preventDefault(); openPalette(); }
});

  } else if (r.indexOf("sec-") === 0 && DATA.sections.some(function (s) { return "sec-" + s.id === r; })) {
    renderSection(DATA.sections.find(function (s) { return "sec-" + s.id === r; }));

  window.scrollTo(0, 0);
  markActive();
}

document.getElementById("sideFoot").innerHTML = "进度只存在这台设备的浏览器里。<br>" + (SITE.repo
  ? '想补充或纠错？看 <a href="' + esc(SITE.repo + "/blob/" + SITE.branch + "/CONTRIBUTING.md") + '" target="_blank" rel="noopener">贡献指南</a>，或去 <a href="' + esc(SITE.repo) + '" target="_blank" rel="noopener">GitHub 仓库</a>。'
  : "内容源文件在 <code>content/</code> 和 <code>exercises/</code>，改完运行 <code>build.py</code>。");
window.RH = { route: route, DATA: DATA };
renderNav();
route();
})();
